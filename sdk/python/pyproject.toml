[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthex-x402"
version = "1.0.0"
description = "Client SDK for Synthex Forge's paid x402 services (USDC on Base). One call: 402 -> EIP-3009 sign -> retry -> signed result."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Synthex Forge", email = "enquiries@ziixcapital.com" }]
keywords = ["x402", "agents", "mcp", "usdc", "base", "payments", "signed", "verifiable"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "eth-account>=0.13",
  "eth-abi>=5",
  "eth-utils>=5",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.urls]
Homepage = "https://synthexforge.com"
Documentation = "https://x402.synthexforge.com/llms.txt"
Source = "https://github.com/hermeschoosenone-debug/synthex-x402"
Issues = "https://github.com/hermeschoosenone-debug/synthex-x402/issues"

[project.scripts]
synthex-x402 = "synthex_x402:_main"

[tool.setuptools]
packages = ["synthex_x402"]
py-modules = ["synthex_x402_selftest"]
